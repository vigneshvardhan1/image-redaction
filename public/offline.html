<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline — Redact</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --canvas: #ffffff;
        --canvas-soft: #f3f3f3;
        --ink: #141414;
        --muted: #707070;
        --hairline: #e0e0e0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #0c0c0d;
          --canvas-soft: #17171a;
          --ink: #f4f4f5;
          --muted: #a1a1a7;
          --hairline: #34343a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        background: var(--canvas);
        color: var(--ink);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 30rem);
        border: 1px solid var(--hairline);
        border-radius: 1.5rem;
        background: var(--canvas-soft);
        padding: 2rem;
        text-align: center;
      }
      .mark {
        display: grid;
        width: 4rem;
        height: 4rem;
        margin: 0 auto;
        place-items: center;
        border-radius: 1.25rem;
        background: #141414;
      }
      h1 {
        margin: 1.5rem 0 0;
        font-size: 1.75rem;
        line-height: 1.1;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.55;
      }
      a,
      button {
        display: inline-flex;
        height: 2.75rem;
        align-items: center;
        justify-content: center;
        margin-top: 1.5rem;
        border: 0;
        border-radius: 9999px;
        background: var(--ink);
        padding: 0 1.25rem;
        color: var(--canvas);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
          <path d="M8 42 48 12" stroke="#e7e5df" stroke-width="9" stroke-linecap="round" />
          <path d="M16 12 56 42" stroke="#e7e5df" stroke-width="9" stroke-linecap="round" />
        </svg>
      </div>
      <h1>You’re offline.</h1>
      <p>
        Redact works without a connection once the editor has loaded. Reconnect and try again to
        open it for the first time, or revisit a page you have already used.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
